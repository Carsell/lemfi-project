# Kept inside the project on purpose, so anyone cloning this repo can run the dbt layer
# without setting up a database or editing ~/.dbt/profiles.yml. DuckDB is a file, not a
# server, so `dbt build --profiles-dir .` works after the Python pipeline creates the CSVs.
lemfi_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: lemfi.duckdb
      threads: 4
